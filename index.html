<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peter Zhang | Software Engineer</title>
    <meta
      name="description"
      content="Peter Zhang - Senior Software Engineer working on distributed systems, data pipelines, and data infrastructure."
    />
    <link rel="canonical" href="https://peterwzhang.github.io/" />

    <!-- Social previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://peterwzhang.github.io/" />
    <meta property="og:title" content="Peter Zhang | Software Engineer" />
    <meta
      property="og:description"
      content="Peter Zhang - Senior Software Engineer working on distributed systems, data pipelines, and data infrastructure."
    />
    <meta property="og:image" content="https://peterwzhang.github.io/assets/images/Peter_Zhang_Profile.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Peter Zhang | Software Engineer" />
    <meta
      name="twitter:description"
      content="Peter Zhang - Senior Software Engineer working on distributed systems, data pipelines, and data infrastructure."
    />
    <meta
      name="twitter:image"
      content="https://peterwzhang.github.io/assets/images/Peter_Zhang_Profile.jpg"
    />

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/images/Peter_Zhang_Profile.jpg" />

    <!-- Apply the saved theme before first paint so dark mode never flashes white. -->
    <script>
      try {
        if (localStorage.getItem('darkMode') === 'true') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* private mode: fall back to light */
      }
    </script>

    <link href="./styles.css" rel="stylesheet" />

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
      integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="desktop-bg bg-cover bg-center h-[100dvh] w-full flex flex-col justify-between">
    <!-- Content for crawlers, link previews, and anyone without JS. -->
    <noscript>
      <div class="absolute inset-0 z-[80] overflow-auto bg-white p-8">
        <h1 class="text-3xl font-bold mb-2">Peter Zhang</h1>
        <p class="text-xl text-gray-600 mb-4">Senior Software Engineer</p>
        <p class="max-w-2xl mb-6">
          I build systems that help businesses move faster, spend smarter, and get more value from their data
          through distributed systems, data pipelines, or internal tools. My focus involves backend
          development and data infrastructure, working on systems that power data analytics and machine
          learning.
        </p>
        <h2 class="text-xl font-bold mb-2">Experience</h2>
        <ul class="mb-6 space-y-1">
          <li>Senior Software Engineer @ Michelin (2024 - Present)</li>
          <li>Software Engineer @ Michelin (2023 - 2024)</li>
          <li>Web Development Assistant @ University of Alabama (2021 - 2022)</li>
        </ul>
        <h2 class="text-xl font-bold mb-2">Links</h2>
        <ul class="space-y-1">
          <li><a class="text-blue-600 underline" href="https://github.com/peterwzhang">GitHub</a></li>
          <li><a class="text-blue-600 underline" href="https://www.linkedin.com/in/pwzhang/">LinkedIn</a></li>
          <li>
            <a class="text-blue-600 underline" href="mailto:peterwengzhang@gmail.com"
              >peterwengzhang@gmail.com</a
            >
          </li>
        </ul>
      </div>
    </noscript>

    <!-- Desktop Icons Area -->
    <div
      id="desktop"
      class="flex-1 p-4 flex flex-wrap content-start gap-4 w-full md:flex-col md:w-32 md:gap-2 relative z-0"
    >
      <!-- Icons injected by window-manager.js -->
    </div>

    <!-- Windows Container -->
    <div id="windows-container" class="absolute inset-0 pointer-events-none z-10">
      <!-- Windows injected by window-manager.js -->
    </div>

    <!-- Taskbar -->
    <div
      class="taskbar h-12 bg-white/80 dark:bg-gray-800/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-700 flex items-center justify-between px-4 z-50 relative select-none"
    >
      <div class="flex items-center gap-4">
        <button
          type="button"
          id="start-button"
          aria-label="Start menu"
          aria-expanded="false"
          aria-controls="start-menu"
          class="p-1.5 bg-gray-900 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors"
          onclick="WindowManager.toggleStartMenu()"
        >
          <i class="fas fa-layer-group text-white text-lg" aria-hidden="true"></i>
        </button>
        <div id="taskbar-apps" class="flex gap-2">
          <!-- Taskbar items injected by window-manager.js -->
        </div>
      </div>

      <div class="taskbar-text flex items-center gap-4 text-sm font-medium text-gray-800 dark:text-gray-200">
        <div class="flex gap-2 text-gray-600 dark:text-gray-400" aria-hidden="true">
          <i class="fas fa-wifi"></i>
          <i class="fas fa-volume-up"></i>
        </div>
        <div id="clock">12:00 PM</div>
      </div>
    </div>

    <!-- Start Menu (Hidden by default) -->
    <div
      id="start-menu"
      class="absolute bottom-14 left-4 w-64 bg-white/90 dark:bg-gray-800/95 backdrop-blur-xl rounded-xl shadow-2xl border border-gray-200 dark:border-gray-700 p-4 hidden z-50 transform origin-bottom-left transition-all"
    >
      <div class="flex items-center gap-3 mb-4 pb-4 border-b border-gray-200 dark:border-gray-600">
        <img
          src="assets/images/Peter_Zhang_Profile.webp"
          width="40"
          height="40"
          class="w-10 h-10 rounded-full object-cover"
          alt="Peter Zhang"
        />
        <div>
          <h2 class="font-bold text-sm dark:text-gray-100">Peter Zhang</h2>
          <p class="text-xs text-gray-500 dark:text-gray-400">Senior Software Engineer</p>
        </div>
      </div>
      <div id="start-menu-items" class="space-y-1">
        <!-- Items injected by window-manager.js -->
      </div>
      <div
        class="mt-4 pt-2 border-t border-gray-200 dark:border-gray-600 flex justify-between text-xs text-gray-500 dark:text-gray-400"
      >
        <button
          type="button"
          class="hover:text-gray-900 dark:hover:text-gray-100"
          onclick="WindowManager.shutdown()"
        >
          <i class="fas fa-power-off" aria-hidden="true"></i> Shut Down
        </button>
        <button
          type="button"
          class="hover:text-gray-900 dark:hover:text-gray-100"
          onclick="WindowManager.lock()"
        >
          <i class="fas fa-lock" aria-hidden="true"></i> Lock
        </button>
      </div>
    </div>

    <!-- Lock Screen -->
    <div
      id="lock-screen"
      class="absolute inset-0 bg-black/60 backdrop-blur-2xl z-[60] hidden flex flex-col items-center justify-center text-white transition-opacity duration-500"
    >
      <div class="text-8xl font-thin mb-8 tracking-wider" id="lock-clock">12:00</div>
      <div class="flex flex-col items-center gap-4">
        <img
          src="assets/images/Peter_Zhang_Profile.webp"
          width="128"
          height="128"
          class="w-32 h-32 rounded-full border-4 border-white/20 shadow-2xl object-cover"
          alt="Peter Zhang"
        />
        <h2 class="text-2xl font-bold">Peter Zhang</h2>
        <div class="flex gap-2 mt-4">
          <input
            type="password"
            id="lock-password"
            aria-label="Password"
            placeholder="Enter Password"
            class="bg-white/10 border border-white/20 rounded-full px-6 py-2 text-white placeholder-white/50 outline-none focus:bg-white/20 transition-colors text-center w-64 backdrop-blur-md"
            onkeydown="if (event.key === 'Enter') WindowManager.unlock();"
          />
          <button
            type="button"
            aria-label="Unlock"
            onclick="WindowManager.unlock()"
            class="bg-white/10 hover:bg-white/20 rounded-full w-10 h-10 flex items-center justify-center transition-colors backdrop-blur-md"
          >
            <i class="fas fa-arrow-right" aria-hidden="true"></i>
          </button>
        </div>
        <p class="text-sm text-white/40 mt-2">Hint: Password is "password" (or anything really)</p>
      </div>
    </div>

    <!-- Shutdown Screen -->
    <div
      id="shutdown-screen"
      class="absolute inset-0 bg-black z-[70] hidden flex items-center justify-center text-white"
    >
      <div class="text-center">
        <div
          class="w-16 h-16 border-4 border-t-transparent border-white rounded-full animate-spin mb-4 mx-auto"
          aria-hidden="true"
        ></div>
        <p class="text-xl font-light tracking-widest">SHUTTING DOWN...</p>
      </div>
    </div>

    <!-- Scripts -->
    <script src="projects-data.js"></script>
    <script src="books-data.js"></script>
    <script src="apps.js"></script>
    <script src="window-manager.js"></script>
  </body>
</html>
